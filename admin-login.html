<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Admin Login | InternCircle</title>
  <link rel="icon" type="image/png" href="Fav Icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-light: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--text-dark);
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 40px;
      border: 1px solid var(--border-color);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-container img {
      height: 48px;
    }

    .login-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--text-light);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-login {
      width: 100%;
      background-color: var(--primary-blue);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-login:hover {
      background-color: var(--primary-hover);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 16px;
      display: none;
      background: #fef2f2;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #fca5a5;
    }

    .dummy-credentials {
      margin-top: 24px;
      padding: 16px;
      background-color: #f1f5f9;
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-light);
      text-align: center;
      border: 1px dashed #cbd5e1;
    }

    .dummy-credentials span {
      display: block;
      font-family: monospace;
      color: var(--primary-blue);
      font-weight: 600;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="logo-container">
        <img src="LOGO.png" alt="InternCircle Logo" onerror="this.src='Fav Icon.png'">
      </div>
      
      <h1 class="login-title">Corporate Portal</h1>
      <p class="login-subtitle">Sign in to the Admin Dashboard</p>

      <div id="error-message" class="error-msg">Invalid email or password.</div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="admin@interncircle.in" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
      </form>

      <div class="dummy-credentials">
        Use these credentials to test locally:
        <span>Email: admin@interncircle.in</span>
        <span>Pass: admin123</span>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-message');

      // Dummy authentication logic
      if (email === 'admin@interncircle.in' && password === 'admin123') {
        // Success: hide error, optionally save state in localStorage, and redirect
        errorMsg.style.display = 'none';
        
        // Optional: Save a fake token to persist login state if needed later
        localStorage.setItem('admin_auth_token', 'dummy-token-12345');
        
        // Redirect to dashboard
        window.location.href = 'admin-dashboard.html';
      } else {
        // Failure: show error message
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
