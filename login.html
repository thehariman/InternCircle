<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Student Login - Free Online Internship in India | InternCircle</title>
  <meta name="description" content="Login to your InternCircle student dashboard. Manage your free online internship applications, track progress, and earn your certificate in India." />
  <meta name="keywords" content="student login InternCircle, free internship in India login, free online internship dashboard" />
  <link rel="canonical" href="https://interncircle.com/login.html" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
  <link rel="icon" type="image/png" href="Fav Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Social Media Meta Tags (Open Graph / Facebook) -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:title" content="Student Login - Free Online Internship in India | InternCircle" />
  <meta property="og:description" content="Login to your InternCircle student dashboard for free online internships in India." />
  <meta property="og:image" content="LOGO.png" />
  <meta property="og:url" content="https://interncircle.com/login.html" />
  <meta property="og:site_name" content="InternCircle" />

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Student Login - Free Online Internship in India | InternCircle" />
  <meta name="twitter:description" content="Login to your InternCircle student dashboard for free online internships in India." />
  <meta name="twitter:image" content="LOGO.png" />
  <!-- JSON-LD: BreadcrumbList -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1, "name": "Home", "item": "https://interncircle.com/"},
      {"@type": "ListItem", "position": 2, "name": "Login", "item": "https://interncircle.com/login.html"}
    ]
  }
  </script>
  <style>
    /* Specific overrides for standalone login page */
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--bg-sec);
      padding: 24px;
      position: relative;
    }
    .login-container {
      max-width: 420px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px;
      box-shadow: var(--shadow-md), 0 0 60px rgba(26, 86, 232, 0.04);
      position: relative;
      z-index: 10;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo {
      height: 60px;
      width: auto;
      object-fit: contain;
      margin-bottom: 12px;
      mix-blend-mode: multiply;
    }
    .login-header h3 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--blue-dark);
      margin-bottom: 6px;
    }
    .login-header p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .form-group-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -6px;
      margin-bottom: 12px;
    }
    .forgot-link {
      font-size: 0.82rem;
      color: var(--blue-primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-redirect {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: var(--transition);
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #ffffff;
    }
    .btn-redirect:hover {
      color: var(--blue-primary);
      border-color: var(--blue-primary);
      background: rgba(26, 86, 232, 0.04);
    }
    .bg-orbs {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body class="login-page">

  <!-- Background Orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1" style="width: 400px; height: 400px; opacity: 0.07;"></div>
    <div class="orb orb-2" style="width: 300px; height: 300px; opacity: 0.07; bottom: 0; left: 0;"></div>
  </div>

  <div class="login-container">
    <div class="login-header">
      <a href="index.html">
        <img src="LOGO.png" alt="InternCircle – Student Login Portal" class="login-logo" width="180" height="60" />
      </a>
      <h3>Student Login</h3>
      <p>Log in to access your internship dashboard</p>
    </div>

    <form class="registration-form" id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address <span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="you@college.edu" required />
        <span class="form-error" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
        <span class="form-error" id="passwordError"></span>
      </div>

      <div class="form-group-row">
        <div class="checkbox-group" style="margin-bottom: 0;">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" name="remember" />
            <span class="checkbox-custom"></span>
            Remember me
          </label>
        </div>
        <a href="#" class="forgot-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">Sign In 🚀</span>
        <span class="btn-loader" style="display:none">Verifying…</span>
      </button>
    </form>

    <div class="login-footer">
      <div>
        Don't have an account? <a href="register.html" class="form-link" style="font-weight:600;">Register Free</a>
      </div>
      <div style="font-size: 0.8rem; display: flex; gap: 12px; justify-content: center; margin-top: 4px;">
        <a href="terms.html" style="color: var(--text-secondary); text-decoration: none;">Terms & Conditions</a>
        <span style="color: var(--border);">|</span>
        <a href="privacy.html" style="color: var(--text-secondary); text-decoration: none;">Privacy Policy</a>
      </div>
      <a href="index.html" class="btn-redirect" style="margin-top: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transform: rotate(180deg);"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Back to Website
      </a>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
